name: grabby

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    image: grabby-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Empty: api.telegram.org with its 50 MB cap. deploy/enable-local-api.sh switches it
      # to the bundled server together with COMPOSE_PROFILES=local-api.
      BOT_API_URL: ${BOT_API_URL:-}
      REDIS_URL: redis://redis:6379/0
      WORK_DIR: /work
      DATA_DIR: /data
    volumes:
      - work:/work
      - data:/data
      # In --local mode getFile returns a path on the Bot API server's disk.
      - bot-api:/var/lib/telegram-bot-api:ro
    depends_on:
      redis:
        condition: service_healthy
      bot-api:
        condition: service_started
        required: false
    # Download subprocesses share this budget. Swap on the host is nearly full, so a job that
    # runs out of memory gets killed and reported instead of dragging the server into swap.
    mem_limit: 680m
    memswap_limit: 680m
    cpus: 1.5
    logging: *logging

  bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [local-api]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api:/var/lib/telegram-bot-api
      # Files are sent as file:///work/..., so the server must see the same path.
      - work:/work:ro
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy volatile-lru
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    logging: *logging

volumes:
  work:
  data:
  bot-api:
  redis:
